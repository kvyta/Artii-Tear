<!DOCTYPE html>
<html>
  <head>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevents scrollbars if your canvas is full-screen */
    }
    canvas {
      display: block; /* Removes the tiny gap at the bottom of the canvas */
      image-rendering: pixelated; 
      image-rendering: crisp-edges;
    }
  </style>
  </head>
<body>
  <canvas id="Canvas" width="600" height="600" style="border:1px solid #000;"></canvas>
  

  <script type="module">
    import { generateAllChunks } from './generator.js';
    import { generateAllTiles } from './generator.js';
    import { drawMap } from './renderer.js';

    const canvas = document.getElementById('Canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const TILE_SIZE = 16;
    const MAP_CSIZE = 5;
    const SCALE = 8;

    canvas.width = MAP_CSIZE * 3 * TILE_SIZE * SCALE;
    canvas.height = MAP_CSIZE * 3 * TILE_SIZE * SCALE;
    
    const tileset = new Image();
    tileset.src = './Tileset-May4.png';

    tileset.onload = () => {
        const myMap = generateAllTiles(generateAllChunks(MAP_CSIZE, MAP_CSIZE, "seed"), "seed");
        drawMap(ctx, myMap, tileset, TILE_SIZE, SCALE);
    };
  </script>
</body>
</html>
